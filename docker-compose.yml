# 多 Agent 智能客服系统 - 容器化编排
# 启动：docker compose up -d --build
# 配置：同目录 .env（DB_PASSWORD、PG_PASSWORD、DASHSCOPE_API_KEY、QIANFAN_API_KEY）
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      MYSQL_DATABASE: agent_admin
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 引擎的会话状态（LangGraph checkpoint）与业务数据（对话/订单/产品）
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${PG_USER:-engine}
      # ⚠️ 密码含 @ : / 等特殊字符时需 URL 编码，否则 DSN 解析会出错
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 设置 PG_PASSWORD}
      POSTGRES_DB: agent_engine
      TZ: Asia/Shanghai
    volumes:
      # postgres:18+ 的数据目录是 /var/lib/postgresql/18/docker，卷要挂在父目录；
      # 挂在 .../data 会被镜像判定为"挂错位置的卷"而拒绝启动
      - pg-data:/var/lib/postgresql
    healthcheck:
      # $$ 是 compose 转义：留给容器内 shell 展开，避免 compose 在解析期插值
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s   # 首次 initdb 要时间，别算进 retries
    # 不映射宿主端口：内网服务，只有 engine 访问（也避免两个项目抢 5432）

  engine:
    build: ./agent_engine
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请在 .env 设置 DASHSCOPE_API_KEY}
      # 模型名透传：换模型只改根目录 .env（不用重建镜像）；未设置时用默认值
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-openai:qwen3.8-2.4t-a95b}
      # 联网搜索 MCP 鉴权：未配置时引擎自动降级（搜索不可用，其余功能正常）
      QIANFAN_API_KEY: ${QIANFAN_API_KEY:-}
      # 会话状态 + 业务数据都在 PG（容器内没有 localhost，走服务名 postgres）
      POSTGRES_DSN: postgresql://${PG_USER:-engine}:${PG_PASSWORD:?}@postgres:5432/agent_engine
    # 数据卷：只剩 FAQ 向量库（checkpoint 和业务数据已迁到 PostgreSQL）
    volumes:
      - engine-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    # 不暴露端口：内网服务，只有 backend 能访问（"Python 不出内网"在部署层落地）
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8082:8082"
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?}
      # 容器内没有 localhost：JDBC 走服务名 mysql（本地开发默认 localhost）
      DB_URL: jdbc:mysql://mysql:3306/agent_admin?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      # 用 :? 而非 :- ——签名密钥不能有公开的默认值：没配就拒绝启动，别静默降级
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}   # ≥32 字符，否则 jjwt 拒绝启动
      # 容器内用服务名通信（本地开发是 localhost）
      AI_SERVICE_URL: http://engine:8001
    depends_on:
      mysql:
        condition: service_healthy
      engine:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  engine-data:
  pg-data:
