server {
    listen 80;

    # 上传体积上限：nginx 默认只有 1MB，不放开的话大于 1MB 的文件会被直接 413。
    # 设成 25m（略高于应用的 20MB 限制），让超限的文件由应用返回"超过 20MB"的友好提示
    client_max_body_size 25m;

    # 静态文件（Vue build 产物）
    root /usr/share/nginx/html;
    index index.html;

    # Vue history 路由：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 Java 后端（容器内服务名 backend）
    location /api/ {
        proxy_pass http://backend:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 支持：必须关缓冲，否则打字机效果失效
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
